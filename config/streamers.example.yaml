# Copy to streamers.yaml. Personal channel information stays on your computer.
defaults:
  clips: 5
  workers: 2
  analysis: offline           # offline / gemini (--ai)
  target_seconds: 45          # 目安。短い素材で不足しても続行
  # source_srt: C:/work/source.srt
  # project: your-google-cloud-project
  format: draft               # draft / mp4 / both (clean MP4 + draft)
  hook: auto                  # auto / off
  width: 720
  height: 1280
  subtitle_color: '#FFFFFF'
  accent_color: '#FFE568'
  font: ''                    # pyCapCut FontType name; blank uses default
  subtitle_size: 8
  subtitle_y: -0.65
  video_scale: 1
  video_x: 0
  video_y: 0
  # MP4仕上げ（src/shorts_only/ffmpeg_recipes.py）
  quality: standard           # draft(最速) / standard / high(最高画質)
  encoder: libx264            # libx264 / h264_nvenc（GPUがある場合）
  background: blur            # blur（ぼかし背景で縦を埋める） / black
  denoise: false              # true で環境ノイズを軽く除去
  jump_cuts: false            # true で無音を詰める（字幕も追従）
  jump_margin: 0.15           # 無音カット時に残す前後の余白（秒）
  # Optional explicit main-body ranges in clip-relative seconds:
  # cuts: [[0, 12.5], [13.2, 30]]
streamers:
  '01':
    name: 配信者01
    accent_color: '#66D9EF'
  '02':
    name: 配信者02
    accent_color: '#FF8FA3'
# Add these settings under an individual streamer when needed:
#   jetcut: true               # optional FFmpeg silence removal, default off
#   hook_seconds: [5, 12, 20]   # clip-relative peak points
#   video_crop: [0, 0, 1, 1]    # x, y, width, height in normalized source coordinates
#   face: {crop: [0.7, 0, 0.3, 0.3], scale: 0.35, x: 0, y: 0.55}
#   template_draft: MyShortsTemplate
#   template_tracks: [{kind: text, name: brand}]
